# Keeps a release PR open on main for every package with unreleased changes, each with its next version (from
# Conventional Commit messages) and changelog; a package's dependents are bumped with it. Merging the PR tags each
# release (<package>-v1.2.3) and creates GitHub releases, then this tests that commit and publishes the released
# packages to GitHub Packages, dependencies first. Any package whose version isn't in the registry yet is published,
# so if a publish fails, run this workflow by hand (Actions → Release Please → Run workflow) once it's fixed.
# Config: release-please-config.json, .release-please-manifest.json

name: Release Please

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
    steps:
    - id: release
      uses: googleapis/release-please-action@v4

  test:
    needs: release-please
    if: needs.release-please.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/test.yml

  publish:
    needs: [release-please, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 26.x
        cache: 'npm'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@andypalmer'
    - run: npm ci
    - name: Publish packages not yet in the registry, dependencies first
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        for package in util vectors data-store records tags orthagonal indexer encoder spider-kit; do
          version=$(node -p "const p = require('./packages/$package/package.json'); p.name + '@' + p.version")
          if [ -z "$(npm view "$version" version 2>/dev/null)" ]; then npm publish -w "packages/$package"; else echo "$version is already published"; fi
        done
