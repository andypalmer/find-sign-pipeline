# Installs (which builds every package), type-checks and tests the whole pipeline.

name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 26.x
        cache: 'npm'
    - run: npm ci
    - run: npm run check
    - run: npm test
